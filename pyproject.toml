[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securefast"
version = "2.0.0"
description = "Intelligent Secure Data Storage with Role-Based Decryption — Zero-Knowledge Anti-OCR Messaging & Vault (Python + C11)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "websockets>=13.0",
  "pydantic>=2.9.0",
  "cryptography>=43.0.0",
  "segno>=1.6.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ziglang>=0.13.0",
]

[project.scripts]
securefast = "securefast.cli:main"

[tool.setuptools.packages.find]
include = ["securefast*"]

[tool.setuptools.package-data]
securefast = [
  "client/static/*",
  "native_bin/*.dll",
  "native_bin/*.so",
  "native_bin/*.dylib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
